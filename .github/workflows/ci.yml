name: CI

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '**.md'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Qt runtime libraries
        # PyQt6 dynamically links against these at import time, even under
        # the offscreen QPA platform used by tests/test_napari_widget.py and
        # tests/test_skeleton_png_warning.py - ubuntu-latest runners don't
        # have them by default, so `import qtpy.QtWidgets` fails at
        # collection time with "libEGL.so.1: cannot open shared object file"
        # before QT_QPA_PLATFORM is ever consulted.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libx11-xcb1 libdbus-1-3

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uvx ruff check

      - name: Ruff format check
        run: uvx ruff format --check

      - name: Build
        run: uv build

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests

      - name: Verify version consistency
        run: |
          uv add PyYAML
          uv run python - <<'PY'
          import tomllib, yaml

          with open("pyproject.toml", "rb") as f:
              pkg_version = tomllib.load(f)["project"]["version"]
          with open("napari_maskel/napari.yaml") as f:
              manifest_version = yaml.safe_load(f)["version"]

          if pkg_version != manifest_version:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml={pkg_version}, "
                  f"napari.yaml={manifest_version}"
              )
          print(f"Versions consistent: {pkg_version}")
          PY
