name: CI

on:
  push:
    paths-ignore:
      - '**.md'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff check
        run: uvx ruff check

      - name: Ruff format check
        run: uvx ruff format --check

      - name: Build
        run: uv build

      - name: Run tests
        run: uv run pytest tests

      - name: Verify version consistency
        run: |
          uv add PyYAML
          uv run python - <<'PY'
          import tomllib, yaml

          with open("pyproject.toml", "rb") as f:
              pkg_version = tomllib.load(f)["project"]["version"]
          with open("napari_maskel/napari.yaml") as f:
              manifest_version = yaml.safe_load(f)["version"]

          if pkg_version != manifest_version:
              raise SystemExit(
                  f"Version mismatch: pyproject.toml={pkg_version}, "
                  f"napari.yaml={manifest_version}"
              )
          print(f"Versions consistent: {pkg_version}")
          PY
